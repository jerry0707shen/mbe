<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MBE 刷题器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
details.home-detail > summary{cursor:pointer;min-height:44px;padding:10px 0;font-weight:600}
details.home-detail[open] > summary{margin-bottom:12px}
#section-filter,#question-section{width:100%;min-height:44px;padding:10px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}

:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --line:#DDE1E6; --line2:#C9CFD6;
  --ink:#1B2430; --ink2:#4A5462; --muted:#5B6472;
  --accent:#1F4E8C; --accent-weak:#E8EEF6; --accent-ink:#FFFFFF; --accent-line:#C3D2E6;
  --ok:#17695A; --ok-weak:#E3F1EC; --bad:#B14A12; --bad-weak:#FBEDE4; --bad-ink:#8F3A0D;
  --flag:#C25B12; --mark:#FFEB99; --mark-ink:#1B2430;
  --bar:#1B2430; --bar-ink:#FFFFFF; --bar-muted:#C9D1DB; --bar-line:#5B6676;
  --tbl:#F7F8FA;
  --sans:'Noto Sans SC',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11161D; --surface:#19202A; --line:#2A3340; --line2:#3A4554;
    --ink:#E6EAF0; --ink2:#C3CAD4; --muted:#9AA4B1;
    --accent:#8DB2E8; --accent-weak:#1F2D42; --accent-ink:#0E1520; --accent-line:#34507A;
    --ok:#6CCBAE; --ok-weak:#163229; --bad:#F2996A; --bad-weak:#3A2419; --bad-ink:#F6B590;
    --flag:#F0A060; --mark:#6E5C14; --mark-ink:#FFF6D6;
    --bar:#0B1016; --bar-ink:#E6EAF0; --bar-muted:#9AA4B1; --bar-line:#3A4554;
    --tbl:#151B23;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161D; --surface:#19202A; --line:#2A3340; --line2:#3A4554;
  --ink:#E6EAF0; --ink2:#C3CAD4; --muted:#9AA4B1;
  --accent:#8DB2E8; --accent-weak:#1F2D42; --accent-ink:#0E1520; --accent-line:#34507A;
  --ok:#6CCBAE; --ok-weak:#163229; --bad:#F2996A; --bad-weak:#3A2419; --bad-ink:#F6B590;
  --flag:#F0A060; --mark:#6E5C14; --mark-ink:#FFF6D6;
  --bar:#0B1016; --bar-ink:#E6EAF0; --bar-muted:#9AA4B1; --bar-line:#3A4554;
  --tbl:#151B23;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
body.in-quiz::before{background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.serif{font-family:var(--serif)}
.hide{display:none!important}

/* ---------- top nav (desktop) ---------- */
.topnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topnav .in{max-width:1240px;margin:0 auto;padding:0 24px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;min-height:60px}
.brand{font-weight:700;font-size:18px;letter-spacing:.02em}
.tabs{display:flex;flex-wrap:wrap;gap:4px;flex-grow:1}
.tabs a{padding:9px 14px;border-radius:6px;color:var(--ink2);text-decoration:none}
.tabs a[aria-current="page"]{background:var(--accent-weak);color:var(--accent);font-weight:500}
.syncpill{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line2);display:inline-block}
.dot.on{background:var(--ok)}.dot.warn{background:var(--flag)}

/* ---------- bottom tabs (phone) ---------- */
.bottomnav{display:none}
@media (max-width:760px){
  .topnav .tabs{display:none}
  .topnav .in{padding:0 16px;min-height:52px}
  .bottomnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:4px 0 calc(6px + env(safe-area-inset-bottom,0px))}
  .bottomnav a{min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);text-decoration:none}
  .bottomnav a[aria-current="page"]{color:var(--accent);font-weight:700}
  .page{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))!important}
}

/* ---------- generic layout ---------- */
.page{max-width:1240px;margin:0 auto;padding:24px 24px 48px}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.colmain{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
.colside{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px}
.card h1{margin:0 0 4px;font-size:21px}
.card h2{margin:0;font-size:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.field{display:flex;flex-direction:column;gap:8px}
.label{font-size:13px;font-weight:500;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink)}
.chip[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-weak);padding:0 13px;font-weight:500}
.chip .n{font-size:12px;color:var(--muted);font-weight:400}
.chip.pill{border-radius:21px;min-height:38px;font-size:14px}
.seg{display:inline-flex;flex-wrap:wrap;align-self:flex-start;max-width:100%;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{min-height:42px;padding:0 16px;border:0;border-left:1px solid var(--line2);background:var(--surface)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.mode{text-align:left;padding:14px 16px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);display:flex;flex-direction:column;gap:2px}
.mode[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-weak);padding:13px 15px}
.mode b{font-size:15px}
.mode span{font-size:13px;color:var(--ink2)}
.num{width:110px;min-height:42px;padding:0 12px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);font-size:16px}
.check{display:flex;align-items:center;gap:10px;min-height:40px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{border-color:var(--accent);color:var(--accent);font-weight:500}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.big{min-height:48px;padding:0 26px;font-size:16px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.big-n{font-size:30px;font-weight:700;line-height:1.1}
.tag{font-size:12px;padding:1px 8px;border-radius:4px;border:1px solid var(--line2);color:var(--muted)}
.tag.acc{background:var(--accent-weak);border-color:transparent;color:var(--accent);font-weight:500}
.tag.bad{background:var(--bad-weak);border-color:transparent;color:var(--bad-ink)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:6px;background:var(--accent)}
.prog{display:flex;flex-direction:column;gap:6px}
.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:10px;background:var(--accent-weak);border:1px solid var(--accent-line)}
.banner.warn{background:var(--bad-weak);border-color:transparent}
.empty{text-align:center;padding:40px 20px;display:flex;flex-direction:column;gap:12px;align-items:center}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-size:13px;color:var(--muted);font-weight:500}
.scrollx{overflow-x:auto}

/* ---------- quiz ---------- */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);color:var(--bar-ink)}
.qbar .in{padding:8px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;min-height:58px}
.qbar .ttl{font-size:14px;color:var(--bar-muted)}
.qbar .pos{font-weight:700;font-size:17px;flex-grow:1}
.qbar .timer{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.qbar .timer.low{color:#FFB37A}
.qbtn{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 13px;border:1px solid var(--bar-line);border-radius:8px;background:transparent;color:var(--bar-ink);font-size:14px}
.qbtn[aria-pressed="true"]{background:var(--flag);border-color:var(--flag);color:#fff}
.qbtn.solid{background:var(--bar-ink);color:var(--bar);border-color:var(--bar-ink);font-weight:700}
.qbtn.icon{padding:0;width:42px;justify-content:center}
.qwrap{display:flex;flex-wrap:wrap;align-items:stretch;min-height:calc(100% - 58px)}
.qnav{flex:1 1 220px;max-width:260px;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:14px}
.qgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.qn{position:relative;height:36px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px}
.qn.done{background:var(--accent-weak);border-color:var(--accent-line);color:var(--ink)}
.qn.cur{border:2px solid var(--accent);color:var(--accent);font-weight:700}
.qn.ok{background:var(--ok-weak);border-color:transparent;color:var(--ok);font-weight:500}
.qn.bad{background:var(--bad-weak);border-color:transparent;color:var(--bad-ink);font-weight:500}
.qn .fl{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.legend{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line)}
.qmain{flex:999 1 560px;min-width:0;padding:28px 40px 40px;display:flex;flex-direction:column;gap:20px}
.qcol{max-width:780px;width:100%;display:flex;flex-direction:column;gap:18px}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.stem{font-family:var(--serif);font-size:18px;line-height:1.7;display:flex;flex-direction:column;gap:12px}
.stem p{margin:0}
mark{background:var(--mark);color:var(--mark-ink);padding:0 1px;border-radius:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.tools .btn{min-height:36px;padding:0 12px;font-size:13px}
.opts{display:flex;flex-direction:column;gap:9px;border:0;margin:0;padding:0}
.opt{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:9px;background:var(--surface);overflow:hidden}
.opt .om{flex-grow:1;display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 14px;border:0;background:transparent;color:var(--ink);line-height:1.55}
.opt .om .lb{font-weight:700;min-width:20px}
.opt .os{width:44px;flex-shrink:0;border:0;border-left:1px solid var(--line);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
.opt.sel{border:2px solid var(--accent);background:var(--accent-weak)}
.opt.strike .om .tx{text-decoration:line-through;color:var(--muted)}
.opt.strike .om .lb{color:var(--muted)}
.opt.ok{border:2px solid var(--ok);background:var(--ok-weak)}
.opt.bad{border:2px solid var(--bad);background:var(--bad-weak)}
.opt .mk{flex-shrink:0;margin-top:3px}
.conf{display:flex;flex-direction:column;gap:8px}
.conf .seg button{min-width:76px}
.verdict{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px 16px;border-radius:8px}
.verdict.ok{background:var(--ok-weak);color:var(--ok)}
.verdict.bad{background:var(--bad-weak);color:var(--bad-ink)}
.verdict b{font-size:16px}
.expl{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:18px}
.expl h3{margin:0;font-size:17px}
.etext{font-family:var(--serif);font-size:16px;line-height:1.7;display:flex;flex-direction:column;gap:11px}
.etext p{margin:0}
.tblk{background:var(--tbl);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--sans);font-size:13px;line-height:1.5;color:var(--ink2);white-space:pre-wrap;overflow-x:auto}
.obj{padding:13px 15px;border-radius:8px;background:var(--accent-weak)}
.obj .k{font-size:13px;font-weight:700;color:var(--accent);font-family:var(--sans)}
.obj div{font-family:var(--serif);font-size:16px}
.pages{display:flex;flex-direction:column;gap:10px}
.pages canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
details.refs summary{cursor:pointer;color:var(--muted);font-size:13px}
details.refs ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink2)}
.wbp{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.wbp textarea{width:100%;min-height:84px;padding:10px 12px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);resize:vertical;font-size:14px;line-height:1.6}
.qfoot{display:flex;gap:10px;justify-content:space-between;padding-top:14px;border-top:1px solid var(--line)}
.pause{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
@media (max-width:760px){
  .qbar .in{padding:6px 8px 6px 4px;gap:4px 8px;min-height:52px}
  .qbar .ttl{display:none}
  .qbar .pos{font-size:15px}
  .qbar .wide{display:none}
  .qnav{display:none}
  .qmain{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .stem{font-size:16.5px;line-height:1.62}
  .etext{font-size:15.5px}
  .qfoot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px))}
  .qfoot .btn{flex-grow:1}
  .qfoot .btn:first-child{flex-grow:0}
}
@media (min-width:761px){ .phone-only{display:none!important} }
@media (max-width:760px){ .wide{display:none!important} }

/* sheet / modal / toast */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:761px){.scrim{align-items:center}}
.sheet{width:100%;max-width:520px;max-height:85%;overflow:auto;background:var(--surface);border-radius:14px 14px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:761px){.sheet{border-radius:12px}}
.sheet h2{margin:0;font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;max-width:90%}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{display:flex;flex-direction:column;gap:7px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:left;width:100%;color:var(--ink)}
.item .st{font-family:var(--serif);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stackbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:24px}
.days{display:flex;align-items:flex-end;gap:4px;height:90px}
.days i{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.importlist{display:flex;flex-direction:column;gap:8px}
.imp{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.imp .nm{flex:1 1 220px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.imp select{min-height:38px;border:1px solid var(--line2);border-radius:6px;background:var(--surface);padding:0 8px}
@media (prefers-reduced-motion:no-preference){ .toast{transition:opacity .2s} }

</style>

<body>
<div id="app"></div>
<script src="./cloud-config.js?v=20261101-supabase"></script>
<script src="./cloud.js?v=20261101-v2"></script>
<script src="./study.js?v=20261101-v2"></script>
<script>
'use strict';
// ===== MBE QBank PDF parser (shared by browser app and node tests) =====
// Builds lines from pdf.js text items, segments questions by option pages,
// infers the correct answer by elimination of "(Choice X)" references.
function itemsToLines(items) {
  const its = [];
  for (const it of items) {
    if (!it || typeof it.str !== 'string' || it.str === '') continue;
    const t = it.transform;
    const size = Math.hypot(t[2], t[3]) || Math.abs(t[3]) || 10;
    its.push({ s: it.str, x: t[4], y: t[5], w: it.width || 0, size });
  }
  its.sort((a, b) => (b.y - a.y) || (a.x - b.x));
  const lines = [];
  for (const it of its) {
    let ln = null;
    for (let i = lines.length - 1; i >= 0 && i >= lines.length - 3; i--) {
      const L = lines[i];
      if (Math.abs(L.y - it.y) <= Math.max(2, 0.35 * Math.min(L.size, it.size))) { ln = L; break; }
    }
    if (!ln) { ln = { y: it.y, size: it.size, parts: [] }; lines.push(ln); }
    ln.parts.push(it);
    ln.size = Math.max(ln.size, it.size);
  }
  const out = [];
  for (const L of lines) {
    L.parts.sort((a, b) => a.x - b.x);
    let text = '', endX = null, tbl = false;
    for (const p of L.parts) {
      if (endX !== null) {
        const gap = p.x - endX;
        if (gap > 2.5 * p.size) { tbl = true; if (!text.endsWith(' ')) text += '   '; }
        if (gap > 0.18 * p.size && !text.endsWith(' ') && !p.s.startsWith(' ')) text += ' ';
      }
      text += p.s;
      endX = p.x + p.w;
    }
    text = text.replace(/ {4,}/g, '   ').replace(/[ \t]+$/,'').trim();
    if (text) out.push({ text, x: L.parts[0].x, y: L.y, size: L.size, tbl });
  }
  return out;
}

const OPT_RE = /^([A-E])\.\s*(.*)$/;
function hasOptionBlock(lines) {
  const seen = { A: false, B: false, C: false, D: false };
  for (const l of lines) { const m = OPT_RE.exec(l.text); if (m && m[1] in seen) seen[m[1]] = true; }
  return seen.A && seen.B && seen.C && seen.D;
}
function classifyPage(lines) {
  if (!lines.length) return 'blank';
  const all = lines.map(l => l.text).join('\n');
  if (/Explanation:/.test(all) || /Educational objective/.test(all)) return 'exp';
  if (hasOptionBlock(lines)) return 'q';
  return 'exp';
}

// Group lines into paragraphs using vertical gaps; lines carry y within a page.
function linesToParas(pagesLines) {

  for (const lines of pagesLines) {

    for (const l of lines) {

      if (!brk && prev) {

        if (gap > 1.6 * Math.max(prev.size, l.size)) brk = true;

function wbState(r) {
  const res = { inWB: false, due: null, streak: 0, wrongN: 0, guessN: 0, lastTs: 0 };
  if (!r) return res;
  const ev = (r.a || []).map((x) => ({ ts: x[1], ok: !!x[3], cf: x[4] || 0 }));
  if (r.w) ev.push({ ts: r.w[1], man: r.w[0] }); ev.sort((a, b) => a.ts - b.ts);
  const exit = ST.cfg.exit || 2; let step = 0;
  for (const e of ev) {
    if (e.man === 'in') { res.inWB = true; res.streak = 0; step = 0; res.due = dayNum(e.ts); continue; }
    if (e.man === 'out') { res.inWB = false; res.due = null; continue; }
    res.lastTs = e.ts;
    const bad = !e.ok || e.cf >= 1;
    if (!e.ok) res.wrongN++; else if (e.cf >= 1) res.guessN++;
    if (bad) { res.inWB = true; res.streak = 0; step = 0; res.due = dayNum(e.ts) + INTERVALS[0]; }
    else if (res.inWB && dayNum(e.ts) >= res.due) {
      res.streak++;
      if (res.streak >= exit) { res.inWB = false; res.due = null; }
      else { step = Math.min(step + 1, INTERVALS.length - 1); res.due = dayNum(e.ts) + INTERVALS[step]; }
    }
  }
  return res;
}
function addAttempt(qid, ch, cf, sec, md) {
  const q = Q.get(qid); if (!q) return;
  const r = ST.recs[qid] || (ST.recs[qid] = { a: [] }); r.a = r.a || [];
  r.a.push([rid(), now(), ch || '', ch && ch === q.ans ? 1 : 0, cf || 0, Math.round(sec || 0), md]);
  if (!r.h) r.h = q.hash;
  touchRec(qid);
}
function setRecField(qid, k, v) { const r = ST.recs[qid] || (ST.recs[qid] = { a: [] }); r[k] = [v, now()]; if (!r.h && Q.get(qid)) r.h = Q.get(qid).hash; touchRec(qid); }
function availableCodes() { return Object.keys(BANK).filter((c) => c !== 'NCBE' || ST.cfg.ncbeOpen); }
function poolIds(codes, pool) {
  const out = [];

    const b = BANK[c]; if (!b) continue;
    for (const q of b.qs) {
      if (!q.ans) continue; const r = ST.recs[q.id]; const at = (r && r.a) || []; let keep = true;
      if (pool === 'unseen') keep = !at.length; else if (pool === 'wrong') keep = at.some((x) => !x[3]);

}

let WBF = { grp: '', reason: '', status: 'due', guess: false, limit: 60 };

    if (WBF.status === 'out' && w.inWB) continue;
    if (WBF.grp && groupOf(q.code).k !== WBF.grp) continue;
    if (WBF.reason && (!r.r || String(r.r[0]) !== WBF.reason)) continue;
    if (WBF.guess && !(w.guessN && !w.wrongN)) continue;

// ================= sessions =================
function newSession(o) {
  const id = 's' + now().toString(36) + Math.random().toString(36).slice(2, 5);
  const s = { id, t: now(), u: now(), mode: o.mode, kind: o.kind || 'block', title: o.title, qids: o.qids, ans: {}, cf: {}, st: {}, fl: {}, sec: {}, sub: {}, hl: {}, cur: 0, lim: o.lim || 0, el: 0, done: false };
  ST.sessions[id] = s; touchSession(s); return s;
}
function startBlock() {
  const c = ST.cfg; const codes = groupsAll().filter((g) => c.groups.includes(g.k)).flatMap((g) => g.c).filter((x) => BANK[x]);
  let ids = poolIds(codes, c.pool); if (!ids.length) { toast('这个条件下没有题'); return; }
  ids = c.shuffle ? shuffle(ids) : ids.sort(); ids = ids.slice(0, c.count);
  c.blockN = (c.blockN || 0) + 1; touchCfg();
  const names = groupsAll().filter((g) => c.groups.includes(g.k)).map((g) => g.n).join('+');
  const s = newSession({ mode: c.mode, qids: ids, title: `Block ${c.blockN} · ${names}`, lim: c.mode === 'exam' ? Math.round(ids.length * c.pace * 60) : 0 });

}
function startFree(scope) {
  const codes=scope?.codes || groupsAll().filter(g=>ST.cfg.groups.includes(g.k)).flatMap(g=>g.c).filter(c=>BANK[c]);
  const section=scope?.section ?? ST.cfg.section ?? '';

  for(const code of codes)for(const q of BANK[code]?.qs || [])if(q.ans && window.MBESections.matches(q.id,section))ids.push(q.id);
  if(!ids.length){toast('这个章节下暂时没有可用题目，请更换科目或章节');return;}
  shuffle(ids);

  ids.sort((a,b)=>Number(!!ST.recs[a]?.a?.length)-Number(!!ST.recs[b]?.a?.length));
  const title=section ? (window.MBESections.nodes.get(section)?.title || '待分节') : '全部章节';
  const s=newSession({mode:'practice',kind:'free',qids:ids,title:'自由做题 · '+title});

}

async function importBackup(file) {
  try {
    const d = JSON.parse(await file.text()); if (d.app !== 'mbe-qbank') throw new Error('不是本应用的备份文件');
    let n = 0;
    for (const [qid, r] of Object.entries(d.recs || {})) { const before = JSON.stringify(ST.recs[qid] || null); ST.recs[qid] = mergeRec(ST.recs[qid], r); if (JSON.stringify(ST.recs[qid]) !== before) { n++; touchRec(qid); } }
    for (const [sid, s] of Object.entries(d.sessions || {})) { const cur = ST.sessions[sid]; if (!cur || (s.u || 0) > (cur.u || 0)) { ST.sessions[sid] = s; Local.mark('s_' + sid); Sync.mark('s_' + sid); } }
    migrateHashes(); render(); toast(`已合并 ${n} 道题的记录`);
  } catch (e) { toast('导入失败：' + e.message); }
}
let JSZIPP = null, DOCXP = null;
function loadScript(src, globalName) { return new Promise((res, rej) => { if (window[globalName]) return res(window[globalName]); const s = document.createElement('script'); const t = setTimeout(() => { s.remove(); rej(new Error('脚本加载超时')); }, 20000); s.src = src; s.onload = () => { clearTimeout(t); res(window[globalName]); }; s.onerror = () => { clearTimeout(t); rej(new Error('脚本加载失败')); }; document.head.appendChild(s); }); }
const loadJSZip = () => (JSZIPP = JSZIPP || loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js', 'JSZip'));
const loadDocx = () => (DOCXP = DOCXP || loadScript('https://cdn.jsdelivr.net/npm/docx@9.6.1/dist/index.iife.js', 'docx'));
const xmlEsc = (s) => String(s ?? '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function buildXlsx(rows, widths) {
  const JSZip = await loadJSZip(); const z = new JSZip();
  const col = (i) => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };

  z.file('_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}package/2006/relationships"><Relationship Id="rId1" Type="${NS}officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`);
  z.file('xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}spreadsheetml/2006/main" xmlns:r="${NS}officeDocument/2006/relationships"><sheets><sheet name="作答记录" sheetId="1" r:id="rId1"/></sheets></workbook>`);
  z.file('xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}package/2006/relationships"><Relationship Id="rId1" Type="${NS}officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${NS}officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
  z.file('xl/styles.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${NS}spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf></cellXfs></styleSheet>`);
  const body = rows.map((r, ri) => `<row r="${ri + 1}">${r.map((v, ci) => { const ref = col(ci) + (ri + 1); if (typeof v === 'number' && isFinite(v)) return `<c r="${ref}"${ri ? '' : ' s="1"'}><v>${v}</v></c>`; return `<c r="${ref}" t="inlineStr" s="${ri ? (String(v).length > 40 ? 2 : 0) : 1}"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`; }).join('')}</row>`).join('');

async function exportXlsx(ids, title) {
  try {
    const set = ids ? new Set(ids) : null; const rows = [['日期', '题号', '科目', '模式', '你的答案', '正确答案', '结果', '把握', '用时（秒）', '当前错因', '笔记', '在错题本']]; const items = [];
    for (const [qid, r] of Object.entries(ST.recs)) { if (set && !set.has(qid)) continue; const q = Q.get(qid); const w = wbState(r); for (const x of r.a || []) items.push([x[1], qid, q ? groupOf(q.code).n : '', MODE_NAME[x[6]] || '', x[2] || '未答', q ? q.ans : '', x[3] ? '对' : '错', CONF[x[4] || 0], x[5], r.r && r.r[0] ? reasonName(r.r[0]) : '', r.n ? r.n[0] : '', w.inWB ? '是' : '否']); }
    items.sort((a, b) => a[0] - b[0]); for (const it of items) { it[0] = fmtFull(it[0]); rows.push(it); }
    if (rows.length === 1) { toast('还没有作答记录'); return; }
    const blob = await buildXlsx(rows, [17, 11, 10, 9, 9, 9, 6, 7, 10, 13, 40, 9]);
    if (await saveFile(`${title ? title.replace(/[\\/:*?"<>|·]/g, ' ').replace(/\s+/g, ' ').trim() : 'MBE作答记录'}_${stamp()}.xlsx`, blob)) toast('Excel 已导出');
  } catch (e) { toast('导出失败：' + e.message); }
}
async function exportDocx(ids, title) {
  if (!ids.length) { toast('没有可导出的题'); return; }
  try {
    toast('正在生成 Word…');
    const D = await loadDocx(); const { Document, Packer, Paragraph, TextRun, HeadingLevel } = D;
    const F = { ascii: 'Cambria', hAnsi: 'Cambria', eastAsia: 'Microsoft YaHei' };
    const P = (text, o = {}) => new Paragraph({ spacing: { after: o.after ?? 100 }, indent: o.indent ? { left: o.indent } : undefined, children: [new TextRun({ text, font: F, size: o.size || 22, bold: o.bold, color: o.color, italics: o.italics })] });
    const kids = [new Paragraph({ heading: HeadingLevel.TITLE, children: [new TextRun({ text: title || 'MBE 错题本', font: F })] }), P(`导出时间 ${fmtFull(now())} · 共 ${ids.length} 题`, { color: '5B6472' })];
    for (const qid of ids) {
      const q = Q.get(qid); if (!q) continue; const r = ST.recs[qid] || {}; const w = wbState(r);
      kids.push(new Paragraph({ heading: HeadingLevel.HEADING_2, spacing: { before: 360, after: 120 }, children: [new TextRun({ text: `${q.id} · ${groupOf(q.code).n}`, font: F })] }));
      const hist = (r.a || []).map((x) => `${fmtDate(x[1])} 选 ${x[2] || '未答'}（${x[3] ? '对' : '错'}${x[4] ? '，' + CONF[x[4]] : ''}）`).join('；');
      kids.push(P(`正确答案 ${q.ans}${hist ? ' · 作答记录：' + hist : ''}`, { color: '1F4E8C', size: 20 }));
      if (r.r && r.r[0]) kids.push(P('错因：' + reasonName(r.r[0]), { size: 20, bold: true }));
      if (r.n && r.n[0]) kids.push(P('我的笔记：' + r.n[0], { size: 20, bold: true }));
      if (w.inWB) kids.push(P('下次复习：' + fmtDay(w.due), { size: 20, color: '5B6472' }));
      for (const p of q.stem) kids.push(P(p));
      for (const [L, t] of Object.entries(q.options)) kids.push(P(`${L === q.ans ? '✓ ' : ''}${L}. ${t}`, { indent: 360, bold: L === q.ans }));
      kids.push(new Paragraph({ heading: HeadingLevel.HEADING_3, spacing: { before: 200, after: 80 }, children: [new TextRun({ text: 'Explanation', font: F })] }));
      for (const p of q.expl) kids.push(p.startsWith('\u0001') ? P(p.slice(1), { size: 18, color: '4A5462' }) : P(p, { size: 21 }));
      if (q.obj) kids.push(P('Educational objective: ' + q.obj, { italics: true, size: 21 }));
    }
    const doc = new Document({ creator: 'MBE 刷题器', title: title || 'MBE 错题本', sections: [{ properties: { page: { margin: { top: 1000, bottom: 1000, left: 1100, right: 1100 } } }, children: kids }] });
    const blob = await Packer.toBlob(doc);
    if (await saveFile(`${(title || 'MBE错题本').replace(/[\\/:*?"<>|·（）]/g, ' ').replace(/\s+/g, ' ').trim()}_${stamp()}.docx`, blob)) toast('Word 已导出');
  } catch (e) { toast('导出失败：' + e.message); }
}
